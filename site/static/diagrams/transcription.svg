<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="trTitle trDesc">
	<title id="trTitle">Voice transcription flow</title>
	<desc id="trDesc">Voice note processed in TEE then NEAR Whisper returning a transcript quote-reply</desc>
	<rect width="720" height="280" fill="#FDFCF9" />

	<rect x="40" y="90" width="140" height="80" fill="#F0EBE0" stroke="#513C35" stroke-width="2" />
	<text x="110" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B201A">Voice note</text>
	<text x="110" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#513C35">in Signal</text>

	<path d="M180 130 L230 130" fill="none" stroke="#EA6023" stroke-width="2.5" marker-end="url(#trArrow)" />

	<rect x="230" y="90" width="160" height="80" fill="#CBE9E6" stroke="#286B63" stroke-width="2" />
	<text x="310" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B201A">TEE bot</text>
	<text x="310" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#513C35">decrypt · strip</text>

	<path d="M390 130 L440 130" fill="none" stroke="#EA6023" stroke-width="2.5" marker-end="url(#trArrow)" />

	<rect x="440" y="90" width="160" height="80" fill="#A8C3EA" stroke="#1C5BB9" stroke-width="2" />
	<text x="520" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B201A">NEAR Whisper</text>
	<text x="520" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1B4A90">GPU STT</text>

	<path d="M520 170 L520 200 L110 200 L110 170" fill="none" stroke="#286B63" stroke-width="2.5" marker-end="url(#trJade)" />
	<text x="300" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#286B63">quote-reply transcript in group</text>

	<defs>
		<marker id="trArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0,0 L6,3 L0,6 Z" fill="#EA6023" />
		</marker>
		<marker id="trJade" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0,0 L6,3 L0,6 Z" fill="#286B63" />
		</marker>
	</defs>
</svg>
