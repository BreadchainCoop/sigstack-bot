<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="icTitle icDesc">
	<title id="icTitle">In-chat translation flow</title>
	<desc id="icDesc">Single Signal group where a human message stays and the bot quote-replies with a translation</desc>
	<rect width="720" height="320" fill="#FDFCF9" />
	<rect x="80" y="40" width="560" height="240" fill="#F6F3EB" stroke="#286B63" stroke-width="2" />
	<text x="360" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1B201A">One bilingual Signal group</text>

	<rect x="120" y="100" width="280" height="64" fill="#FDFCF9" stroke="#EAE2D6" stroke-width="1.5" />
	<text x="140" y="128" font-family="system-ui,sans-serif" font-size="14" fill="#1B201A">Human: Hola equipo</text>
	<text x="140" y="150" font-family="system-ui,sans-serif" font-size="12" fill="#808080">original stays</text>

	<path d="M260 164 L260 190" fill="none" stroke="#EA6023" stroke-width="2.5" marker-end="url(#icArrow)" />

	<rect x="160" y="200" width="320" height="56" fill="#CBE9E6" stroke="#286B63" stroke-width="2" />
	<text x="180" y="226" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1B201A">Bot quote-reply: Hello team</text>
	<text x="180" y="246" font-family="system-ui,sans-serif" font-size="12" fill="#513C35">same thread · other language</text>

	<defs>
		<marker id="icArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0,0 L6,3 L0,6 Z" fill="#EA6023" />
		</marker>
	</defs>
</svg>
