# Retired — use docker/compose.translation.yaml (one Signal number).
# BOT__ROLE=transcription fail-fasts. This stub exists so old scripts fail clearly.

name: sigstack-transcription-retired

services:
  retired:
    image: alpine:3.20
    command:
      [
        "sh",
        "-c",
        "echo 'Use docker/compose.translation.yaml (unified bot; BOT__ROLE=translation).' >&2; exit 1",
      ]
