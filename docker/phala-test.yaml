# Minimal Phala smoke: Signal CLI only (useful before attaching a product bot).
# Prefer product stacks for real deploys:
#   docker/phala.transcription.yaml
#   docker/phala.translation.yaml

services:
  signal-api:
    image: bbernhard/signal-cli-rest-api@sha256:2399d449123cdad56c4d859277e3b9127e1a00c4d2ab4601c239882609286cf8
    environment:
      - MODE=normal
      - LOG_LEVEL=info
    volumes:
      - signal-config-test:/home/.local/share/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  signal-config-test:
    driver: local
