name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /sigstack-bot/cypherslate
      - name: Prepare Pages artifact for /sigstack-bot/cypherslate
        shell: bash
        run: |
          set -euo pipefail

          # The GitHub Pages project site mounts the artifact at `/<repo>/`.
          # To support an extra `/cypherslate/` segment, we relocate the built output
          # under `build/cypherslate/` and leave a root redirect at `build/index.html`.
          mkdir -p build/cypherslate

          shopt -s dotglob nullglob
          for item in build/* build/.[!.]* build/..?*; do
            base_name="$(basename "$item")"
            if [[ "$base_name" == "cypherslate" ]]; then
              continue
            fi
            mv "$item" "build/cypherslate/"
          done

          cat > build/index.html <<'EOF'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=/sigstack-bot/cypherslate/">
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
