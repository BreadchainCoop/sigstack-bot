<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="ltTitle ltDesc">
	<title id="ltTitle">Language Threads message flow</title>
	<desc id="ltDesc">Main multilingual hub connected to Spanish and English sidecars with relay and translate arrows</desc>
	<rect width="720" height="420" fill="#FDFCF9" />
	<rect x="260" y="40" width="200" height="88" fill="#CBE9E6" stroke="#286B63" stroke-width="2" />
	<text x="360" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1B201A">Main</text>
	<text x="360" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#513C35">multilingual hub</text>

	<rect x="48" y="280" width="200" height="88" fill="#F0EBE0" stroke="#286B63" stroke-width="2" />
	<text x="148" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1B201A">Spanish sidecar</text>
	<text x="148" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#513C35">monolingual ES</text>

	<rect x="472" y="280" width="200" height="88" fill="#F0EBE0" stroke="#286B63" stroke-width="2" />
	<text x="572" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1B201A">English sidecar</text>
	<text x="572" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#513C35">monolingual EN</text>

	<path d="M300 128 L180 280" fill="none" stroke="#EA6023" stroke-width="2.5" marker-end="url(#arrowOrange)" />
	<path d="M420 128 L540 280" fill="none" stroke="#EA6023" stroke-width="2.5" marker-end="url(#arrowOrange)" />
	<path d="M200 280 L320 128" fill="none" stroke="#1C5BB9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)" />
	<path d="M520 280 L400 128" fill="none" stroke="#1C5BB9" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowBlue)" />
	<path d="M248 324 L472 324" fill="none" stroke="#286B63" stroke-width="2.5" marker-end="url(#arrowJade)" />

	<text x="200" y="200" font-family="system-ui,sans-serif" font-size="12" fill="#EA6023" font-weight="700">translate / relay</text>
	<text x="470" y="200" font-family="system-ui,sans-serif" font-size="12" fill="#EA6023" font-weight="700">translate / relay</text>
	<text x="330" y="310" font-family="system-ui,sans-serif" font-size="12" fill="#286B63" font-weight="700">translate</text>
	<text x="240" y="250" font-family="system-ui,sans-serif" font-size="11" fill="#1C5BB9">relay raw</text>
	<text x="430" y="250" font-family="system-ui,sans-serif" font-size="11" fill="#1C5BB9">relay raw</text>

	<defs>
		<marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0,0 L6,3 L0,6 Z" fill="#EA6023" />
		</marker>
		<marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0,0 L6,3 L0,6 Z" fill="#1C5BB9" />
		</marker>
		<marker id="arrowJade" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
			<path d="M0,0 L6,3 L0,6 Z" fill="#286B63" />
		</marker>
	</defs>
</svg>
