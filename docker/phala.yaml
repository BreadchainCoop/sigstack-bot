# Phala Cloud TEE — one Signal number on one CVM (tdx.medium).
#
# No local Whisper sidecar. Voice posts audio to NEAR AI Whisper Large V3.
# One signal-api + one signal-bot: hub, translation, and voice. Per-message
# tokio::spawn keeps STT from stalling other handlers.
#
# Build & push (linux/amd64):
#   docker buildx build --platform linux/amd64 -t YOUR_DOCKERHUB/signal-bot-tee:latest -f docker/Dockerfile --push .
#   docker buildx build --platform linux/amd64 -t YOUR_DOCKERHUB/signal-registration-proxy:latest -f docker/Dockerfile.proxy --push .
#
# First create: `phala deploy -n sigstack-translation …`
# Later upgrades MUST use `--cvm-id 0e82fa77-8b15-4dbd-89c4-9045ab911353` (or the live app id)
# so volumes stay (Signal phone session + group prefs). Do not rename volumes below.
# See docs/one-cvm-architecture.md#cvm-storage-keep-intact
#   phala deploy --cvm-id YOUR_CVM -c docker/phala.yaml -e docker/phala.env --wait
#
# Registration proxy :8081 (phone B). Do not re-register phone A.

services:
  signal-api:
    image: bbernhard/signal-cli-rest-api@sha256:2399d449123cdad56c4d859277e3b9127e1a00c4d2ab4601c239882609286cf8
    environment:
      - MODE=normal
      - LOG_LEVEL=info
    volumes:
      - signal-config-translation:/home/.local/share/signal-cli
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  signal-bot:
    image: ${SIGNAL_BOT_IMAGE}
    environment:
      - SIGNAL__SERVICE_URL=http://signal-api:8080
      - SIGNAL__PHONE_NUMBER=${SIGNAL_PHONE}
      - NEAR_AI__API_KEY=${NEAR_AI_API_KEY}
      - NEAR_AI__BASE_URL=${NEAR_AI_BASE_URL:-https://cloud-api.near.ai/v1}
      - NEAR_AI__MODEL=${NEAR_AI_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - NEAR_AI__TIMEOUT=${NEAR_AI_TIMEOUT:-120s}
      - WHISPER__ENABLED=true
      - WHISPER__SERVICE_URL=${NEAR_AI_BASE_URL:-https://cloud-api.near.ai/v1}
      - WHISPER__MODEL=${WHISPER_MODEL:-openai/whisper-large-v3}
      - WHISPER__TIMEOUT=${WHISPER_TIMEOUT:-120s}
      - TRANSLATE_ALL__ENABLED=${TRANSLATE_ALL_ENABLED:-true}
      - TRANSLATE_ALL__MAX_MESSAGES_PER_MINUTE=${TRANSLATE_ALL_MAX_MESSAGES_PER_MINUTE:-30}
      - BOT__LOG_LEVEL=${LOG_LEVEL:-info}
      - BOT__SIGNAL_USERNAME=${BOT_SIGNAL_USERNAME:-}
      - BOT__GITHUB_REPO=${BOT_GITHUB_REPO:-https://github.com/BreadchainCoop/sigstack-bot}
      - DSTACK__SOCKET_PATH=/var/run/dstack.sock
      - GROUP_PREFERENCES__PERSIST=true
      - GROUP_PREFERENCES__STORAGE_PATH=/data/group_prefs.enc
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - group-prefs-translation:/data
    depends_on:
      - signal-api
    restart: unless-stopped

  signal-registration-proxy:
    image: ${SIGNAL_PROXY_IMAGE}
    environment:
      - SIGNAL__API_URL=http://signal-api:8080
      - REGISTRY__PATH=/data/registry.enc
      - SERVER__LISTEN_ADDR=0.0.0.0
      - SERVER__PORT=8081
      - DSTACK__SOCKET_PATH=/var/run/dstack.sock
      - RATE_LIMIT__GLOBAL_PER_MINUTE=${RATE_LIMIT_GLOBAL_PER_MINUTE:-60}
      - RATE_LIMIT__PER_NUMBER_PER_HOUR=${RATE_LIMIT_PER_NUMBER_PER_HOUR:-10}
      - LOG__LEVEL=${LOG_LEVEL:-info}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - registry-data:/data
    ports:
      - "8081:8081"
    depends_on:
      - signal-api
    restart: unless-stopped

volumes:
  # Keep these names: renaming creates empty volumes and drops Signal identity + prefs.
  signal-config-translation:
    driver: local
  registry-data:
    driver: local
  group-prefs-translation:
    driver: local
